<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Creature Seekers: Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wdth@98&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="images/svg" href="images/hexie-favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" href="images/quiz-hexie-neutral.svg" as="image">
    <link rel="preload" href="images/quiz-hexie-incorrect.svg" as="image">
    <link rel="preload" href="images/quiz-hexie-correct.svg" as="image">
</head>

<!-- TO DO - try pre-loading-->

<body>

    <!-- top banner with icon, page title and burger menu -->
    <header class="floating-header" id="floating-header">
        <a href="index.html" class="header-link" id="logo-link" aria-label="Home">
            <img src="images/hexie-favicon.svg" alt="" width="36" height="36">
        </a>
        <h2 class="site-title">Creature Seekers</h2>
        <button type="button" class="header-link" id="burger" aria-expanded="false" aria-controls="dropdown-menu">
            <span aria-hidden="true" id="burger-icon">☰</span>
            <span class="visually-hidden">Main menu</span>
        </button>
    </header>


    <!-- Pull-out menu -->
    <nav id="dropdown-menu" aria-label="dropdown-menu">
        <ul>
            <li><a href="help-how-to-use.html">Help! How to use</a></li>
            <li><a href="about-info.html">About info</a></li>
            <li><a href="policies.html">Privacy and accessbility</a></li>
            <li><a href="feedback.html">Give feedback</a></li>
            <li><a href="issue-report.html">Report an issue</a></li>
            <li><a href="settings.html">Settings</a></li>
        </ul>
    </nav>


    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav" aria-label="main menu">
        <a href="index.html" class="nav-option">
            <div class="nav-icon"><img src="images/home-icon.svg" alt=""> </div>
            <div class="label">Home</div>
        </a>

        <a href="profiles.html" class="nav-option">
            <div class="nav-icon"><img src="images/profile-icon.svg" alt=""></div>
            <div class="label">Profiles</div>
        </a>
        <!-- codeword shown by default, feedback shown when all found-->
        <a href="codeword.html" class="nav-option" id="progressNav">
            <div class="nav-icon">
                <img src="images/codeword-icon.svg" alt="" id="progressNavIcon">
            </div>
            <div class="label" id="progressNavLabel">Codeword</div>
        </a>

        <a href="map.html" class="nav-option">
            <div class="nav-icon"><img src="images/map-icon.svg" alt=""></div>
            <div class="label">Map</div>
        </a>

        <a href="quiz.html" class="nav-option current">
            <div class="nav-icon"><img src="images/quiz-icon.svg" alt=""></div>
            <div class="label">Quiz</div>
        </a>
    </nav>

    <main>

        <!-- Page content -->

        <h1 class="visually-hidden">Creature Seekers quiz</h1>

        <section id="quiz-box">
            <div class="hexie-help">
                <div class="hexie-info-box">
                    <div class="hexie-speech">
                        <!-- Message will be inserted here -->
                        <p id="quiz-para-text"></p>
                    </div>
                </div>
                <div class="hexie-chatting">
                    <img src="images/hexie-happy.svg" alt="hexie happy">
                </div>
            </div>
        </section>


        <section class="pop-box quiz-app quiz-front" id="quiz-app">

            <!-- Start and end Hexie messages -->
            <div class="hexie-help" id="quiz-hexie-help">
                <div class="hexie-info-box" id="hexie-quiz-info-box">
                    <div class="hexie-text">
                        <!-- Hexie message goes here-->
                    </div>
                </div>
                <div class="hexie-chatting">
                    <img src="images/hexie-happy.svg" alt="hexie happy">
                </div>
            </div>



            <div class="quiz">
                <div id="quiz-header">
                    <div id="quiz-question-img"><img src="images/mystery-bug-animation-hex.svg" alt="Mystery bug hex">
                    </div>
                    <h3 id="quiz-question">Question goes here</h3>
                </div>
                <div id="answer-buttons">
                    <button type="button" class="quiz-option-btn">Answer 1</button>
                    <button type="button" class="quiz-option-btn">Answer 2</button>
                    <button type="button" class="quiz-option-btn">Answer 3</button>
                    <button type="button" class="quiz-option-btn">Answer 4</button>
                </div>
                <div id="quiz-results" class="results-table-wrapper hidden" aria-live="polite"></div>
                <div class="confetti-container"></div>
                <div class="quiz-footer">
                    <div id="quiz-feedback">
                        <div id="quiz-feedback-hexie"><img src="images/hexie-favicon.svg" alt="" width="36" height="36">
                        </div>
                        <div id="quiz-feedback-text">
                        </div>
                    </div>

                    <button type="button" id="quiz-next-btn">Next</button>
                </div>
            </div>
        </section>



        <div id="menu-overlay" class="menu-overlay hidden"></div>

        <!-- keep scripts in this order -->
        <script src="script.js"></script>

        <script src="quiz.js"></script>



    </main>


</body>

</html>
